aid: rezilient-health
name: Rezilient Health
description: >-
  Rezilient Health is an employer-sponsored primary and specialty care provider
  that combines physical CloudClinics with telehealth to deliver unlimited,
  zero-cost care to employees on behalf of employers, health plans, health
  systems, and brokers. Its hybrid CloudClinic model pairs on-site medical staff
  with remote physicians and connected diagnostic equipment so members can access
  in-person and virtual visits, with the goal of lowering total healthcare spend
  and improving clinical outcomes. Rezilient offers patient-facing web and mobile
  apps for scheduling and care, but publishes no public developer portal, API,
  SDK, or documentation surface. This profile was surfaced as a Techstars
  portfolio company and enriched by the API Evangelist pipeline; the honest result
  is that Rezilient operates a consumer/enterprise healthcare service rather than a
  developer platform.
